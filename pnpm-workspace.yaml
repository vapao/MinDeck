packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

# 0.3.280 / 0.3.284 分别是首个支持 Opus 5.5 / Sonnet 5.5 的 SDK，发布不足 24h 时经开发者同意提前放行；仅限这两个版本
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk@0.3.280 || 0.3.284'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.280 || 0.3.284'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.280 || 0.3.284'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.280 || 0.3.284'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.280 || 0.3.284'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.280 || 0.3.284'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.280 || 0.3.284'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.280 || 0.3.284'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.280 || 0.3.284'
